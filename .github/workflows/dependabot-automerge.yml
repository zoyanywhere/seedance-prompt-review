name: Dependabot auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for successful Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for number in $(jq -r '.[].number' <<< "$PRS_JSON"); do
            pr=$(gh pr view "$number" --repo "$REPO" --json author,state,headRefOid)
            author=$(jq -r '.author.login' <<< "$pr")
            state=$(jq -r '.state' <<< "$pr")
            sha=$(jq -r '.headRefOid' <<< "$pr")
            if [[ ( "$author" == 'dependabot[bot]' || "$author" == 'app/dependabot' ) && "$state" == 'OPEN' && "$sha" == "$TESTED_SHA" ]]; then
              gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$sha"
              # GITHUB_TOKEN merges do not emit push workflow runs.
              gh workflow run release.yml --repo "$REPO" --ref main
            fi
          done
