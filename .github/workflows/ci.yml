name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: python scripts/check_secrets.py
      - run: pip-audit -r requirements.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag seedance-review:test .
      - name: Validate production configuration
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci-only APP_IMAGE=seedance-review:test docker compose -f compose.production.yaml config --quiet
      - run: |
          docker image inspect seedance-review:test --format '{{.Config.User}}' | grep -x '10001:10001'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seedance-review:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
