name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build runtime test image with FFmpeg
        run: docker build --pull --target test --tag seedance-review:tests .
      - run: python -m compileall -q app
      - name: Test inside the non-root application runtime
        run: docker run --rm --network none seedance-review:tests
      - run: python scripts/check_secrets.py
      - run: pip-audit -r requirements.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag seedance-review:test .
      - name: Validate production configuration
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci-only APP_IMAGE=seedance-review:test docker compose -f compose.production.yaml config --quiet
          POSTGRES_PASSWORD=ci-only APP_IMAGE=seedance-review:test docker compose -f compose.production.yaml config --format json | python -c 'import json,sys; assert json.load(sys.stdin)["services"]["app"]["tmpfs"] == ["/tmp:size=128m,noexec,nosuid,nodev"]'
      - run: |
          docker image inspect seedance-review:test --format '{{.Config.User}}' | grep -x '10001:10001'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seedance-review:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
