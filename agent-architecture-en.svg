<text x="263" y="2072" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Is the prompt ready for creator approval?</text>
<text x="263" y="2099" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Five ordered nonempty blocks · valid media aliases · timing and project constraints</text>
<text x="263" y="2125" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">A clean model verdict cannot bypass failed checks. Source conflicts stop approval.</text>
