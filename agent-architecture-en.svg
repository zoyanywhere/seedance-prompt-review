<text x="263" y="1892" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Independently verify the repaired prompt</text>
<text x="263" y="1919" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Audit against source evidence, project rules and prior findings.</text>
<text x="263" y="1945" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Close major findings with evidence in the revision; otherwise keep them open.</text>
