<text x="1373" y="1514" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Identity, state transitions</text>
<text x="1373" y="1540" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Reference and shot continuity</text>
