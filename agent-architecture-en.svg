<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2850" viewBox="0 0 1800 2850"><title>Promptlab: Film and Scene / Short and Ad production workflow</title><rect width="100%" height="100%" fill="#080808"/>
<text x="60" y="50" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#ff6a25">ZOYA ANYWHERE / PROMPTLAB</text>
<text x="60" y="113" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="48" fill="#f5eee8">One application. Two creative profiles.</text>
<text x="60" y="151" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="24" fill="#c1b7ae">Implemented workflow · project-scoped rules · five-block prompts · creator approval</text>
