<path d="M895 465V505" class="line"/><rect x="580" y="515" width="630" height="110" rx="20" fill="#302720" stroke="#CE8A61" stroke-width="2"/><text x="605" y="555" class="model">gpt-6-sol</text><text x="605" y="595" class="head">Draft prompt with clear media roles</text>
<text x="65" y="676" class="model">1 · FOUR INDEPENDENT SPECIALIST REVIEWS · SAME STORYBOARD VERSION AND MEDIA</text>
<rect x="65" y="710" width="400" height="160" rx="19" fill="#302720" stroke="#D88C5D" stroke-width="2"/><text x="90" y="751" class="model">gpt-6-sol</text><text x="90" y="792" class="head">Action &amp; timing</text><text x="90" y="830" class="small">Shot order, duration, end state</text>
