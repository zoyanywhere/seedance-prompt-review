<text x="263" y="2402" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Final prompt + reference mapping + separate settings</text>
<text x="263" y="2429" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">1  Scene context &amp; cinematography                 2  Active references &amp; binding</text>
<text x="263" y="2455" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">3  Action beats &amp; timing                                  4  Locks &amp; constraints</text>
<text x="263" y="2481" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">5  Animation &amp; physics</text>
<text x="263" y="2507" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">@Image1 / @Video1 / @Audio1 → actual file names; duration / ratio / resolution separately</text>
<rect x="60" y="2570" width="810" height="170" rx="16" fill="#171717" stroke="#7fccc1" stroke-width="2"/>
<text x="83" y="2604" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#7fccc1">OPERATIONS</text>
<text x="83" y="2642" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Usage, isolation and compatibility</text>
<text x="83" y="2669" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Token / cost ledger includes previews and failed-call reserves.</text>
<text x="83" y="2695" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Project ownership and versioned checkpoints isolate contexts.</text>
<text x="83" y="2721" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Existing projects keep their workflow until a profile is selected.</text>
<rect x="930" y="2570" width="810" height="170" rx="16" fill="#171717" stroke="#7fccc1" stroke-width="2"/>
<text x="953" y="2604" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#7fccc1">PLANNING ADVICE / NOT EXECUTED HERE</text>
<text x="953" y="2642" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Previs, hero-shot tests and post-production</text>
<text x="953" y="2669" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Recommendations support difficult spatial / physical actions.</text>
<text x="953" y="2695" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">No automatic Blender, video rendering, lip-sync or compositing.</text>
<text x="953" y="2721" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">No promise of exact visual reproduction or virality.</text>
<text x="60" y="2810" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#c1b7ae">MODEL DEFAULTS · Configurable per deployment · Production profiles / 2026-10-03</text>
