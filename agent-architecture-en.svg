<text x="263" y="452" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Brief + purpose + image / video / audio references</text>
<text x="263" y="479" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Project choices: audio, morphing, realism, style, camera; resolution and aspect ratio separately</text>
<text x="263" y="505" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Both profiles allow creative rule breaks. The creator approves the proposed 4–30 second duration.</text>
