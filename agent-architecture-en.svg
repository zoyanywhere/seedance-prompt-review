<text x="603" y="942" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Direct the storyboard and timing</text>
<text x="603" y="969" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Select valid style / camera entries per shot; explain direct or recommended previs.</text>
<text x="603" y="995" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Define initial / final states, continuous timing and visible / audible acceptance criteria.</text>
