<text x="83" y="584" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#7fccc1">SIX MASTER DOCUMENTS</text>
<text x="83" y="622" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Versioned production library</text>
<text x="83" y="649" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">46 camera movements · 20 styles</text>
<text x="83" y="675" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Matching sound profiles · camera looks</text>
<text x="83" y="701" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Production planning · five blocks</text>
<text x="83" y="727" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae"></text>
<text x="83" y="753" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Curated, role-specific selections</text>
<text x="83" y="779" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Creator intent outranks recipes</text>
<text x="83" y="805" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">No universal music / morphing ban</text>
<text x="83" y="831" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Version included in review context</text>
<text x="83" y="857" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Changed rules require a new plan</text>
<text x="83" y="883" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Source observation stays independent</text>
<rect x="580" y="550" width="1160" height="150" rx="16" fill="#171717" stroke="#7fccc1" stroke-width="2"/>
<text x="603" y="584" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#7fccc1">SOURCE EVIDENCE / CONDITIONAL ON UPLOADED MEDIA</text>
<text x="603" y="622" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Gemini 3.8 Flash high → GPT-6.1 Sol high</text>
<text x="603" y="649" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Analyze actual images, video and audio; Sol cross-checks timestamped video frames.</text>
<text x="603" y="675" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Preserve uncertainty. Cache observations by source identity and reference role.</text>
