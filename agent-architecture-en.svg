<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590" role="img" aria-labelledby="title desc">
<title id="title">Seedance 2.5: Agent Architecture with Independent Opus Review</title>
<desc id="desc">The creator brief and media pass through technical validation, storyboard approval, and prompt drafting to four specialist agents. Claude Opus 5.5 independently reviews their findings and the full context. GPT-6 Sol supervises revisions and escalates critical conflicts to GPT-6 Astra. A linter and creator approval complete the workflow.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef3ff}.title{font-size:44px;font-weight:750}.head{font-size:25px;font-weight:700}.model{font-size:19px;font-weight:700;fill:#aee1ff}.small{font-size:17px;fill:#bfd0e9}.line{stroke:#8398bd;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#f2bd71;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#gold)}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8398bd"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#f2bd71"/></marker></defs>
<rect width="1800" height="1590" fill="#0b1220"/><text x="65" y="68" class="title">Seedance 2.5 · Agent Architecture and Workflow</text><text x="68" y="105" class="small">Phase 1: brief, image/video/audio, output settings, storyboard, and prompt review · no BytePlus generation</text>
<rect x="65" y="145" width="505" height="140" rx="20" fill="#173454" stroke="#568fbf" stroke-width="2"/><text x="90" y="185" class="model">CREATOR TEAM · INVITE-ONLY ACCESS</text><text x="90" y="226" class="head">Brief + reference media</text><text x="90" y="257" class="small">Choose duration, 16:9/9:16, 480p/720p/1080p</text>
<path d="M570 215H630" class="line"/><rect x="640" y="145" width="490" height="140" rx="20" fill="#263b34" stroke="#75bc8d" stroke-width="2"/><text x="665" y="185" class="model">NO LLM · TECHNICAL VALIDATION</text><text x="665" y="226" class="head">Validate media + settings</text><text x="665" y="257" class="small">Format, duration, size, task type, reference IDs</text>
<path d="M1130 215H1190" class="line"/><rect x="1200" y="145" width="535" height="140" rx="20" fill="#193b3e" stroke="#57aaa5" stroke-width="2"/><text x="1225" y="185" class="model">gpt-6-luna → gpt-6-sol</text><text x="1225" y="226" class="head">Structure brief → storyboard</text><text x="1225" y="257" class="small">Shots, timing, media roles, end states</text>
<path d="M1470 285V330H895V345" class="line"/><rect x="605" y="355" width="580" height="110" rx="20" fill="#42371f" stroke="#e6b665" stroke-width="2"/><text x="630" y="394" class="model">CREATOR-TEAM</text><text x="630" y="435" class="head">Approve storyboard and settings</text>
<path d="M895 465V505" class="line"/><rect x="580" y="515" width="630" height="110" rx="20" fill="#1d304f" stroke="#7096c5" stroke-width="2"/><text x="605" y="555" class="model">gpt-6-sol</text><text x="605" y="595" class="head">Draft prompt with clear media roles</text>
<text x="65" y="676" class="model">1 · FOUR INDEPENDENT SPECIALIST REVIEWS · SAME STORYBOARD VERSION AND MEDIA</text>
<rect x="65" y="710" width="400" height="160" rx="19" fill="#1d304f" stroke="#598cd0" stroke-width="2"/><text x="90" y="751" class="model">gpt-6-sol</text><text x="90" y="792" class="head">Action &amp; timing</text><text x="90" y="830" class="small">Shot order, duration, end state</text>
<rect x="485" y="710" width="400" height="160" rx="19" fill="#28304c" stroke="#9b83d5" stroke-width="2"/><text x="510" y="751" class="model">gemini-3.8-flash</text><text x="510" y="792" class="head">Camera &amp; visuals</text><text x="510" y="830" class="small">Image references, style, framing</text>
<rect x="905" y="710" width="400" height="160" rx="19" fill="#28304c" stroke="#9b83d5" stroke-width="2"/><text x="930" y="751" class="model">gemini-3.8-flash</text><text x="930" y="792" class="head">Audio &amp; Dialog</text><text x="930" y="830" class="small">Sound, speech, music, timestamps</text>
<rect x="1325" y="710" width="400" height="160" rx="19" fill="#3b3040" stroke="#cf8faa" stroke-width="2"/><text x="1350" y="751" class="model">claude-sonnet-5-5</text><text x="1350" y="792" class="head">Continuity</text><text x="1350" y="830" class="small">Characters, objects, media mapping</text>
<path d="M265 870V913H895" class="line"/><path d="M685 870V913H895" class="line"/><path d="M1105 870V913H895" class="line"/><path d="M1525 870V913H895" class="line"/>
<path d="M895 913V977" class="line"/><text x="65" y="966" class="model">2 · INDEPENDENT REVIEW DESK · AFTER SPECIALIST REVIEWS</text>
<rect x="445" y="986" width="910" height="122" rx="20" fill="#483247" stroke="#d28eb8" stroke-width="2"/><text x="475" y="1025" class="model">claude-opus-5-5 · CHALLENGE REVIEW</text><text x="475" y="1067" class="head">Challenge full context + specialist findings</text><text x="475" y="1095" class="small">Flags conflicts and blind spots; does not approve changes</text>
<path d="M900 1108V1140" class="line"/>
<rect x="445" y="1150" width="910" height="117" rx="20" fill="#49361f" stroke="#e2aa58" stroke-width="2"/><text x="475" y="1188" class="model">3 · gpt-6-sol · SUPERVISOR · gpt-6-astra FOR CRITICAL CONFLICTS</text><text x="475" y="1230" class="head">Resolve findings, revise prompt, document risks</text><text x="475" y="1254" class="small">Change storyboard or media roles only with creator approval</text>
<path d="M900 1267V1295H600V1305" class="line"/><rect x="270" y="1312" width="350" height="105" rx="18" fill="#263b34" stroke="#75bc8d" stroke-width="2"/><text x="295" y="1350" class="model">NO LLM</text><text x="295" y="1390" class="head">Seedance linter</text>
<path d="M620 1364H670" class="line"/><rect x="680" y="1312" width="465" height="105" rx="18" fill="#173454" stroke="#568fbf" stroke-width="2"/><text x="705" y="1350" class="model">CREATOR-TEAM</text><text x="705" y="1390" class="head">Approve prompt + risks</text>
<path d="M1145 1364H1195" class="line"/><rect x="1205" y="1312" width="530" height="105" rx="18" fill="#24384c" stroke="#7498b7" stroke-width="2"/><text x="1230" y="1350" class="model">OUTPUT</text><text x="1230" y="1390" class="head">Final prompt + reference plan</text>
<path d="M270 1364H210V1210H435" class="loop"/>
<rect x="270" y="1470" width="1465" height="95" rx="18" fill="#1b3441" stroke="#5da6c0" stroke-width="2"/><text x="295" y="1507" class="model">COST DASHBOARD · ALL MODEL CALLS</text><text x="295" y="1545" class="head">Tokens and estimated cost by agent, round, and full run · budget checked before each call</text>
