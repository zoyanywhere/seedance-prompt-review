<path d="M895 913V977" class="line"/><text x="65" y="966" class="model">2 · INDEPENDENT REVIEW DESK · AFTER SPECIALIST REVIEWS</text>
<rect x="445" y="986" width="910" height="122" rx="20" fill="#3B2724" stroke="#F28D66" stroke-width="2"/><text x="475" y="1025" class="model">gpt-6-sol · CHALLENGE REVIEW</text><text x="475" y="1067" class="head">Challenge full context + specialist findings</text><text x="475" y="1095" class="small">Flags conflicts and blind spots; does not approve changes</text>
<path d="M900 1108V1140" class="line"/>
<rect x="445" y="1150" width="910" height="117" rx="20" fill="#3A291F" stroke="#FFAF70" stroke-width="2"/><text x="475" y="1188" class="model">3 · gpt-6-sol · SUPERVISOR · gpt-6-astra FOR CRITICAL CONFLICTS</text><text x="475" y="1230" class="head">Resolve findings, revise prompt, document risks</text><text x="475" y="1254" class="small">Change storyboard or media roles only with creator approval</text>
