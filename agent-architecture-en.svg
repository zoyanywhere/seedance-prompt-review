<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2320" viewBox="0 0 1800 2320"><title>Seedance review architecture: current system and proposed improvements</title><rect width="100%" height="100%" fill="#161616"/>
<text x="60" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="44" fill="#fff7f2">Seedance 2.5 | Agent architecture &amp; workflow</text>
<text x="60" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#fff7f2">IMPLEMENTED WORKFLOW | Explicit effort settings, source evidence and parallel specialist reviews</text>
<text x="60" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#78cbbd">Quality goal: first-pass creative fidelity and realism; total cost per accepted video.</text>
<rect x="60" y="195" width="800" height="165" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="82" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">CREATOR TEAM | INVITE-ONLY ACCESS</text>
<text x="82" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Creator brief + image / video / audio uploads</text>
<text x="82" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Intent, must-haves, source roles and output settings</text>
<text x="82" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Duration / aspect ratio / resolution are separate parameters</text>
<rect x="930" y="195" width="810" height="165" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="952" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">NO LLM VALIDATION + GPT-6 LUNA</text>
<text x="952" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Validate inputs + organize the creator brief</text>
<text x="952" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Check media limits; preserve all creator requirements</text>
<text x="952" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Luna structures intent; it does not invent source events</text>
<polyline points="860,275 930,275" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="930,275 916,266 916,284" fill="#ff7a36"/>
<polyline points="1335,360 1335,395 900,395 900,425" fill="none" stroke="#78cbbd" stroke-width="4"/>
<polygon points="900,425 891,411 909,411" fill="#78cbbd"/>
<rect x="430" y="425" width="940" height="175" rx="16" fill="#2d2724" stroke="#78cbbd" stroke-width="2" stroke-dasharray="9 6"/>
<text x="452" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#78cbbd">GEMINI 3.8 FLASH · HIGH + SOL 6.1 CRITICAL FRAME CHECK</text>
<text x="452" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Analyze source media BEFORE planning shots</text>
<text x="452" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Timestamped observations: motion, camera, identity and audio</text>
<text x="452" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Sampled frames with timestamps; distinguish facts from uncertainty</text>
<text x="452" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Shared evidence goes to the storyboard and every reviewer</text>
<polyline points="900,600 900,635" fill="none" stroke="#78cbbd" stroke-width="4"/>
<polygon points="900,635 891,621 909,621" fill="#78cbbd"/>
<rect x="430" y="635" width="940" height="160" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="452" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">CLAUDE OPUS 5.5 · HIGH</text>
<text x="452" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Direct + storyboard + propose 4–30s → Creator approval</text>
<text x="452" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Artistic intent, hook, rhythm, source roles and end states</text>
<text x="452" y="776" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Reference scene cards; optional Gemini 3.1 Flash Image previews</text>
<polyline points="900,795 900,830" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,830 891,816 909,816" fill="#ff7a36"/>
<rect x="430" y="830" width="940" height="145" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="452" y="865" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">GPT-6.1 SOL · HIGH</text>
<text x="452" y="906" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Draft the prompt from approved shots + source evidence</text>
<text x="452" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Use @ImageN / @VideoN / @AudioN with clear source roles</text>
<polyline points="900,975 900,1020" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1020 891,1006 909,1006" fill="#ff7a36"/>
<text x="60" y="1050" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#78cbbd">FOUR SPECIALIST REVIEWS | PARALLEL EXECUTION · SAME PROMPT VERSION AND SOURCE EVIDENCE</text>
<rect x="60" y="1080" width="405" height="165" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="82" y="1115" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">GPT-6.1 SOL · HIGH</text>
<text x="82" y="1156" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Action, timing &amp; hook</text>
<text x="82" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Timing, hook and payoff</text>
<text x="82" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Required final states</text>
