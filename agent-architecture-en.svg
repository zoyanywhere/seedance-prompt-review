<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590" role="img" aria-labelledby="title desc">
<title id="title">Seedance 2.5: Agent Architecture with Independent Sol Review</title>
<desc id="desc">The creator brief and media pass through technical validation, storyboard drafting, reference-based scene cards or optional AI preview generation, creator approval, and prompt drafting to four specialist agents. GPT-6 Sol independently reviews their findings and the full context. GPT-6 Sol supervises revisions and escalates critical conflicts to GPT-6 Astra. A linter and creator approval complete the workflow.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#FFF7F2}.title{font-size:44px;font-weight:750}.head{font-size:25px;font-weight:700}.model{font-size:19px;font-weight:700;fill:#FF7A36}.small{font-size:17px;fill:#F1DCD0}.line{stroke:#FF7A36;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#FFAE72;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#gold)}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#FF7A36"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#FFAE72"/></marker></defs>
<rect width="1800" height="1590" fill="#161616"/><text x="65" y="68" class="title">Seedance 2.5 · Agent Architecture and Workflow</text><text x="68" y="105" class="small">Phase 1: brief, image/video/audio, output settings, storyboard, and prompt review · no BytePlus generation</text>
<rect x="65" y="145" width="505" height="140" rx="20" fill="#30231E" stroke="#FB4E04" stroke-width="2"/><text x="90" y="185" class="model">CREATOR TEAM · INVITE-ONLY ACCESS</text><text x="90" y="226" class="head">Brief + reference media</text><text x="90" y="257" class="small">Choose duration, 16:9/9:16, 480p/720p/1080p</text>
<path d="M570 215H630" class="line"/><rect x="640" y="145" width="490" height="140" rx="20" fill="#29302B" stroke="#D3AA80" stroke-width="2"/><text x="665" y="185" class="model">NO LLM · TECHNICAL VALIDATION</text><text x="665" y="226" class="head">Validate media + settings</text><text x="665" y="257" class="small">Format, duration, size, task type, reference IDs</text>
<path d="M1130 215H1190" class="line"/><rect x="1200" y="145" width="535" height="140" rx="20" fill="#2E2825" stroke="#E28D62" stroke-width="2"/><text x="1225" y="185" class="model">gpt-6-luna → gpt-6-sol</text><text x="1225" y="226" class="head">Structure brief → storyboard</text><text x="1225" y="257" class="small">Shots, timing, media roles, end states</text>
