<text x="507" y="1156" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Camera &amp; visuals</text>
<text x="507" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Video + image evidence</text>
<text x="507" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Framing, motion, source fidelity</text>
<polyline points="687,1245 687,1280 900,1280" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1280 886,1271 886,1289" fill="#ff7a36"/>
<rect x="910" y="1080" width="405" height="165" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="932" y="1115" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">GEMINI 3.8 FLASH · HIGH</text>
<text x="932" y="1156" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Audio &amp; dialogue</text>
<text x="932" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Actual audio / video sources</text>
<text x="932" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Speech, sound and timing</text>
<polyline points="1112,1245 1112,1280 900,1280" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1280 914,1271 914,1289" fill="#ff7a36"/>
<rect x="1335" y="1080" width="405" height="165" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="1357" y="1115" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">CLAUDE SONNET 5.5 · HIGH</text>
<text x="1357" y="1156" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Continuity</text>
<text x="1357" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Identity and object continuity</text>
<text x="1357" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Cross-shot source consistency</text>
<polyline points="1537,1245 1537,1280 900,1280" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1280 914,1271 914,1289" fill="#ff7a36"/>
<polyline points="900,1280 900,1320" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1320 891,1306 909,1306" fill="#ff7a36"/>
<rect x="430" y="1320" width="940" height="150" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="452" y="1355" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">GPT-6 ASTRA · HIGH</text>
<text x="452" y="1396" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Astra supervises + repairs supported findings</text>
<text x="452" y="1432" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Resolve contradictions; preserve intentional creative rule breaks</text>
<text x="452" y="1461" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Concrete repairs and targeted rechecks; stop stalled repetition</text>
<polyline points="900,1470 900,1505" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1505 891,1491 909,1491" fill="#ff7a36"/>
<rect x="430" y="1505" width="940" height="160" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="452" y="1540" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">CLAUDE OPUS 5.5 · HIGH</text>
<text x="452" y="1581" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Opus independently audits the repaired prompt</text>
<text x="452" y="1617" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Original intent + source evidence + per-shot acceptance criteria</text>
<text x="452" y="1646" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Verify closure; return remaining blockers to Astra</text>
<polyline points="900,1665 900,1700" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="900,1700 891,1686 909,1686" fill="#ff7a36"/>
<rect x="430" y="1700" width="940" height="140" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="452" y="1735" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">DETERMINISTIC GATE + CREATOR APPROVAL</text>
<text x="452" y="1776" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Linter + verified findings → Creator decision</text>
<text x="452" y="1812" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">Block approval while major / critical findings or linter errors remain</text>
<polyline points="430,1770 30,1770 30,1395 430,1395" fill="none" stroke="#78cbbd" stroke-width="4"/>
<polygon points="430,1395 416,1386 416,1404" fill="#78cbbd"/>
<text x="65" y="1462" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#78cbbd">Repair + recheck</text>
<text x="65" y="1493" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#78cbbd">Shared source evidence</text>
<polyline points="1370,1770 1535,1770 1535,1870" fill="none" stroke="#ff7a36" stroke-width="4"/>
<polygon points="1535,1870 1526,1856 1544,1856" fill="#ff7a36"/>
<rect x="60" y="1870" width="1680" height="115" rx="16" fill="#2d2724" stroke="#ff7a36" stroke-width="2"/>
<text x="82" y="1905" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ff7a36">EXTERNAL STUDIO NOW | BYTEPLUS GENERATION IN A LATER PHASE</text>
<text x="82" y="1946" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#fff7f2">Handoff: final prompt + media alias / upload-order list + separate API settings</text>
<text x="65" y="1858" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#fff7f2">COST LEDGER: tokens, reasoning, previews, agent / round / full-run totals · bounded retries and spend</text>
<rect x="60" y="2020" width="1680" height="265" rx="16" fill="#2d2724" stroke="#78cbbd" stroke-width="2"/>
<text x="82" y="2060" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#78cbbd">CREATIVE QUALITY CONTRACT</text>
<text x="82" y="2104" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff7f2">Video project assessed by professors — not a master thesis.</text>
<text x="82" y="2144" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff7f2">Timing is realism: movement, reactions, perception, readable text and a credible payoff.</text>
<text x="82" y="2184" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff7f2">Preserve motivated creative rule breaks; correct accidental inconsistencies.</text>
<text x="82" y="2224" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff7f2">Assess hook and audience engagement; artistic intention stays central. Virality is not guaranteed.</text>
<text x="82" y="2264" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff7f2">Measure success on generated videos: requirements met, film quality and total cost per accepted result.</text></svg>