<text x="263" y="1674" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#ff6a25">GPT-6 ASTRA / HIGH</text>
<text x="263" y="1712" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" fill="#f5eee8">Repair supported findings and deterministic errors</text>
<text x="263" y="1739" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Revise the actual prompt; preserve creator intent and approved reference authority.</text>
<text x="263" y="1765" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="21" fill="#c1b7ae">Do not silently erase blockers or repeat an unchanged prompt.</text>
