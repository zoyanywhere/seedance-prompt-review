services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: seedance
      POSTGRES_DB: seedance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MEDIA_ROOT: /app/data/media
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - media_data:/app/data/media
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal, egress]
  db:
    image: postgres:17.5-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: seedance
      POSTGRES_USER: seedance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedance -d seedance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
networks:
  internal:
    internal: true
  egress: {}
volumes:
  postgres_data:
  media_data:
