services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the published commit image}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: seedance
      POSTGRES_DB: seedance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MEDIA_ROOT: /app/data/media
      SECURE_COOKIES: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "${TRUSTED_PROXY_IPS:-127.0.0.1}"]
    volumes: [media_data:/app/data/media]
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    memswap_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.0}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, web-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: web-network
      traefik.http.routers.promptlab.rule: Host(`${APP_DOMAIN:-promptlab.zoyanywhere.com}`)
      traefik.http.routers.promptlab.entrypoints: websecure
      traefik.http.routers.promptlab.tls.certresolver: myresolver
      traefik.http.services.promptlab.loadbalancer.server.port: "8000"
  db:
    image: postgres:17.11-alpine3.23
    user: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    mem_limit: ${DB_MEMORY_LIMIT:-192m}
    memswap_limit: ${DB_MEMORY_LIMIT:-192m}
    environment:
      POSTGRES_DB: seedance
      POSTGRES_USER: seedance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [postgres_data:/var/lib/postgresql/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedance -d seedance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
networks:
  internal: {internal: true}
  web-network: {external: true}
volumes:
  media_data:
  postgres_data:
